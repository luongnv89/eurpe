# EURPE local configuration — copy to config.yaml and edit as needed.
# `eurpe smoke` will create config.yaml from this file if it does not exist.

# Where ingested proposal documents live on disk.
corpus_path: ./data/corpus

# Where the local vector index is persisted.
index_path: ./data/index

# Where the FastAPI service stores short-lived runtime state — staging
# uploads from the ingestion UI, parse-token records, and the YAML
# sidecar archive written by POST /api/ingestion/confirm. Safe to wipe;
# nothing here is the source of truth for the corpus or the index.
runtime_dir: ./data/runtime

# Model runtime configuration. Default remains local/offline. Cloud
# providers require an env-var API key and an explicit network_allowlist
# entry for the provider host:443 before a request can leave the machine.
models:
  runtime: ollama        # ollama | mlx | openai | openrouter | groq | lmstudio | vllm | llamacpp | anthropic | gemini
  llm_model: llama3.1:8b
  embedding_model: nomic-embed-text
  ollama_base_url: http://localhost:11434
  # Optional generation backend override. Examples:
  #   OpenAI-compatible local servers:
  #     LM Studio: http://localhost:1234/v1
  #     vLLM:      http://localhost:8000/v1
  #     llama.cpp: http://localhost:8080/v1
  #   Cloud providers usually use built-in defaults; override only for
  #   proxies/self-hosted gateways.
  llm_base_url:
  # Environment variable name containing the API key/token. Leave blank
  # to use provider defaults such as OPENAI_API_KEY, ANTHROPIC_API_KEY,
  # GEMINI_API_KEY, OPENROUTER_API_KEY, GROQ_API_KEY, or VLLM_API_KEY.
  llm_api_key_env:

# Block all outbound network access by default.
offline_mode: true

# Network egress allowlist. Default is empty: only loopback
# (localhost, 127.0.0.1, ::1) is allowed. Each entry opens ONE
# host:port pair. The `reason` field is copied verbatim into the
# JSONL audit log at <runtime_dir>/network-audit.log so a future
# reviewer can answer "why was this allowed?" without re-reading
# this file. Example (commented):
#
# network_allowlist:
#   - host: telemetry-mirror.example.org
#     port: 443
#     reason: "Internal CRD telemetry mirror approved 2025-10-01"
network_allowlist: []

# Logging verbosity: DEBUG | INFO | WARNING | ERROR
log_level: INFO
