[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eurpe"
version = "0.1.0"
description = "EURPE — fully-local AI assistant for drafting EU research proposals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Montimage", email = "contact@montimage.eu" },
]
keywords = ["eu", "horizon-europe", "rag", "langgraph", "ollama", "local-ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # python-multipart powers FastAPI ``UploadFile`` form parsing used by
    # ``POST /api/ingestion/parse``. FastAPI does not pull it transitively.
    "python-multipart>=0.0.9",
    "typer>=0.12",
    # Docling is the proposal PDF parser (see eurpe.ingestion). Pinned to
    # the 2.x line; let the venv resolve the exact compatible torch /
    # huggingface-hub / numpy versions.
    "docling>=2.0,<3.0",
    # Chroma is the local-only vector store used by eurpe.retrieval. The
    # 1.x line is required because 0.5.x pulls a tokenizers wheel that
    # cannot build on Python 3.14 (PyO3 < 0.23). 1.x ships its embedding
    # path lazily, so we can pass ``embedding_function=None`` and stay
    # fully offline (we supply our own vectors). Telemetry is disabled at
    # client-construction time in ``eurpe.retrieval.index``.
    "chromadb>=1.0,<2.0",
    # httpx is used by ``eurpe.retrieval.embeddings.OllamaEmbedder`` to
    # talk to the local Ollama daemon. Already pulled transitively by
    # fastapi but pinned explicitly so the embedder remains importable
    # if fastapi's dep set ever drops it.
    "httpx>=0.27",
    # python-docx powers the DOCX section export renderer (see
    # ``eurpe.export.docx``). The 1.x line is stable and offline-friendly
    # (no network calls, pure-Python writer). lxml is its only transitive
    # native dep and ships wheels for every supported platform.
    "python-docx>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    # Used only by the synthetic-PDF integration test to generate a tiny
    # PDF on the fly. Listed under [dev] so production installs don't pull
    # it; the test gracefully skips if it isn't present.
    "reportlab>=4.0",
]

[project.scripts]
eurpe = "eurpe.cli:app"

[project.urls]
Repository = "https://github.com/luongnv89/eurpe"

[tool.hatch.build.targets.wheel]
packages = ["src/eurpe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
# B008 fires on Typer's idiomatic ``Argument()`` / ``Option()`` calls in
# parameter defaults (see ``eurpe.cli:smoke`` and ``eurpe.ingestion.cli:ingest``).
# Typer's whole CLI declaration model relies on this pattern; rewriting every
# command to lift the calls into module-level constants buys nothing in
# correctness and noisier diffs. Project-wide ignore documents the convention.
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# ``--strict-markers`` is enabled above, so any custom marker MUST be
# registered here or every test run errors. ``docling`` covers integration
# tests that import docling and may download model weights on first run.
markers = [
    "docling: integration tests that require docling and may download model weights",
    "e2e: end-to-end pipeline tests that iterate over proposals/ (slow)",
]
